<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 290px;
      padding: 20px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h2 {
      margin: 0;
      color: #333;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background-color: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .toggle-label {
      font-weight: bold;
      color: #333;
    }
    
    /* Toggle Switch Styles */
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      -webkit-transition: .4s;
      transition: .4s;
      border-radius: 34px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      -webkit-transition: .4s;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #4CAF50;
    }
    
    input:focus + .slider {
      box-shadow: 0 0 1px #4CAF50;
    }
    
    input:checked + .slider:before {
      -webkit-transform: translateX(26px);
      -ms-transform: translateX(26px);
      transform: translateX(26px);
    }
    
    .status {
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }
    
    .status.enabled {
      background-color: #4CAF50;
      color: white;
    }
    
    .status.disabled {
      background-color: #f44336;
      color: white;
    }
    
    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.4;
    }
    
    .feature {
      margin: 10px 0;
      padding: 8px;
      background-color: #f5f5f5;
      border-radius: 4px;
    }
    
    .refresh-notice {
      font-size: 12px;
      color: #ff9800;
      text-align: center;
      margin-top: 10px;
      padding: 8px;
      background-color: #fff3cd;
      border-radius: 4px;
      display: none;
    }
    
    .balance-info {
      color: #666;
      font-size: 14px;
      line-height: 1.4;
    }
    
    .current-balance {
      margin: 10px 0;
      padding: 12px;
      background-color: #e8f5e8;
      border-radius: 8px;
      border-left: 4px solid #4CAF50;
    }
    
    .balance-amount {
      font-size: 18px;
      font-weight: bold;
      color: #2e7d32;
      display: block;
      margin: 8px 0;
    }
    
    .balance-source {
      font-size: 11px;
      color: #888;
      font-style: italic;
    }

    .earnings-btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin: 0 0 12px 0;
    }

    .earnings-btn:hover {
      background-color: #43a047;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Fiverr Privacy Extension</h2>
  </div>

  <button id="earningsBtn" class="earnings-btn" type="button">Earning</button>
  
  <div class="toggle-container">
    <span class="toggle-label">Hide Balance</span>
    <label class="switch">
      <input type="checkbox" id="hideToggle">
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="toggle-container">
    <span class="toggle-label">Dark Mode</span>
    <label class="switch">
      <input type="checkbox" id="darkToggle">
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="toggle-container">
    <span class="toggle-label">Auto Refresh (Advance)</span>
    <label class="switch">
      <input type="checkbox" id="autoRefreshToggle">
      <span class="slider"></span>
    </label>
  </div>
  
  <div id="autoRefreshStatus" style="display:none; text-align:center; font-size:12px; color:#666; margin-bottom:10px; padding:6px; background:#f0f8f0; border-radius:4px;">
    Next refresh in <span id="countdown">--:--</span>
  </div>
  
  <div class="status enabled" id="statusDiv">
    🔒 Balance Hiding: ON
  </div>
  
  <div class="refresh-notice" id="refreshNotice">
    ⚠️ Refresh the Fiverr page to apply changes
  </div>
  
  <div class="balance-info">
    <div class="current-balance">
      <strong>💰 Your Current Balance:</strong><br>
      <span class="balance-amount" id="balanceAmount">Loading...</span>
      <span class="balance-source" id="balanceSource"></span>
    </div>
    
    <p style="font-size: 12px; color: #999; margin-top: 15px;">
      Your balance is safely displayed here while hidden from public view.
    </p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
